module: cutouts
order: 400
scad_array: cutouts
go_package: cutouts
description: >
  Defines cutouts (holes) in enclosure faces that map to the legacy cutouts arrays.
  Each entry must specify face, position, dimensions, and shape.

fields:
  face:
    type: string
    required: true
    enum: [front, back, left, right, top, lid, bottom, base]
    desc: Which face of the enclosure

  from_face_left:
    type: number
    required: true
    desc: >
      Horizontal position along the face from the left edge (mm).
      Used by all faces: base, lid, front, back, left, right.

  from_face_bottom:
    type: number
    desc: >
      Vertical position from the bottom edge of the face (mm).
      Required for side faces (front, back, left, right).
      Not valid for horizontal faces (base, lid).

  from_face_back:
    type: number
    desc: >
      Depth position from the back edge of the face (mm).
      Required for horizontal faces (base, lid).
      Not valid for side faces (front, back, left, right).

  width:
    type: number
    desc: Cutout width (set to 0 for circles)

  length:
    type: number
    desc: Cutout length (set to 0 for circles)

  radius:
    type: number
    desc: Corner/circle radius (set to 0 for rectangles)

  shape:
    type: string
    required: true
    enum: [rectangle, circle, rounded_rect, circle_with_flats, circle_with_key, polygon]
    desc: Cutout shape (maps to YAPP shape flag)

  depth:
    type: number
    desc: Cutout depth (defaults to shell thickness)

  angle:
    type: number
    desc: Rotation angle in degrees

  polygon:
    type: string
    desc: "Polygon preset shape name (required when shape=polygon). Options: hexagon, arrow, 6pt_star, iso_triangle, iso_triangle2, triangle, triangle2"
    enum: [hexagon, arrow, 6pt_star, iso_triangle, iso_triangle2, triangle, triangle2]

  mask:
    type: object
    desc: >
      Ventilation mask to apply to the cutout opening. Uses predefined patterns from YAPP:
      honeycomb, hex_circles, circles, squares, bars, offset_bars. Optionally adjust placement
      within the opening using offsets and rotation.
    fields:
      preset:
        type: string
        desc: "Mask preset name"
        enum: [honeycomb, hex_circles, circles, squares, bars, offset_bars]
      offset_x:
        type: number
        desc: "Horizontal offset of the mask within the opening"
      offset_y:
        type: number
        desc: "Vertical offset of the mask within the opening"
      rotation:
        type: number
        desc: "Additional rotation applied to the mask within the opening (degrees)"

  coordinate:
    type: string
    default: pcb
    enum: [pcb, box, box_inside]
    desc: "Coordinate system: pcb (yappCoordPCB, default), box (yappCoordBox), box_inside (yappCoordBoxInside)"

  origin:
    type: string
    default: global
    enum: [global, center, alt]
    desc: "Origin placement: global (yappOrigin/yappGlobalOrigin, default), center (yappCenter), alt (yappAltOrigin/yappLeftOrigin)"

tests:
  - name: rectangle_cutout_side_face
    desc: Rectangular cutout on side face (front)
    input:
      face: front
      from_face_left: 10
      from_face_bottom: 15
      width: 20
      length: 10
      radius: 0
      shape: rectangle
    expect_valid: true

  - name: circle_cutout_side_face
    desc: Circular cutout on side face (back)
    input:
      face: back
      from_face_left: 25
      from_face_bottom: 20
      width: 0
      length: 0
      radius: 5
      shape: circle
    expect_valid: true

  - name: cutout_on_base
    desc: Cutout on horizontal face (base)
    input:
      face: base
      from_face_left: 15
      from_face_back: 20
      width: 25
      length: 25
      radius: 5
      shape: rounded_rect
    expect_valid: true

  - name: missing_face
    desc: Should fail when face is missing
    input:
      from_face_left: 10
      from_face_bottom: 15
      width: 20
      length: 10
      radius: 0
      shape: rectangle
    expect_error: "missing required field"

  - name: polygon_hexagon_base
    desc: Polygon cutout with hexagon preset on base
    input:
      face: base
      from_face_left: 15
      from_face_back: 15
      width: 25
      length: 25
      radius: 5
      shape: polygon
      polygon: hexagon
    expect_valid: true

  - name: polygon_arrow_lid
    desc: Polygon cutout with arrow preset on lid
    input:
      face: lid
      from_face_left: 10
      from_face_back: 20
      width: 20
      length: 20
      radius: 0
      shape: polygon
      polygon: arrow
      angle: 30
    expect_valid: true

