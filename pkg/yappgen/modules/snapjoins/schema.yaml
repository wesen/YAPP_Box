module: snap_joins
order: 300
scad_array: snapJoins
go_package: snapjoins
description: >
  Defines snap join locations that map to the legacy snapJoins array.
  Each entry specifies position along an edge and width, with side flag appended.

fields:
  pos:
    type: number
    required: true
    desc: Position along the edge (mm)

  width:
    type: number
    required: true
    desc: Width of snap join (mm)

  side:
    type: string
    required: true
    enum: [left, right, front, back]
    desc: Which side of enclosure (appended as YAPP flag)

tests:
  - name: left_snap
    desc: Snap join on left side
    input:
      pos: 20
      width: 10
      side: left
    expect_valid: true

  - name: missing_side
    desc: Should fail when side is missing
    input:
      pos: 20
      width: 10
    expect_error: "missing required field"

  - name: invalid_side
    desc: Should fail with invalid side value
    input:
      pos: 20
      width: 10
      side: top
    expect_error: "invalid"

