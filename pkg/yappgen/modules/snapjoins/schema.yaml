module: snap_joins
order: 300
scad_array: snapJoins
go_package: snapjoins
description: >
  Defines snap join locations that map to the legacy snapJoins array.
  Each entry specifies position along an edge and width, with side flag appended.

fields:
  pos:
    type: number
    required: true
    desc: Position along the edge (mm)

  width:
    type: number
    required: true
    desc: Width of snap join (mm)

  side:
    type: string
    required: true
    enum: [left, right, front, back]
    desc: Which side of enclosure (appended as YAPP flag)

  alignment:
    type: string
    enum: [origin, center]
    default: origin
    desc: Position reference (maps to yappOrigin/yappCenter)

  symmetric:
    type: bool
    desc: Mirror snap to opposite edge (yappSymmetric)

  diamond:
    type: bool
    desc: Use diamond-shaped snap instead of round (yappRectangle)

tests:
  - name: left_snap
    desc: Snap join on left side
    input:
      pos: 20
      width: 10
      side: left
    expect_valid: true

  - name: centered_symmetric
    desc: Snap with center alignment and symmetric flag
    input:
      pos: 25
      width: 8
      side: left
      alignment: center
      symmetric: true
    expect_valid: true

  - name: diamond_snap
    desc: Diamond-shaped snap join
    input:
      pos: 30
      width: 4
      side: right
      alignment: center
      diamond: true
      symmetric: true
    expect_valid: true

  - name: missing_side
    desc: Should fail when side is missing
    input:
      pos: 20
      width: 10
    expect_error: "missing required field"

  - name: invalid_side
    desc: Should fail with invalid side value
    input:
      pos: 20
      width: 10
      side: top
    expect_error: "invalid"

