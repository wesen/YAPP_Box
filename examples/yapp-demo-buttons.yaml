project: yapp-demo-buttons
version: 0
units: mm
yapp_version: v3.3.8

pcb:
  length: 30
  width: 40
  thickness: 1.6
  z_clearance: 3.0
  standoffs:
    diameter: 6.0
    screw_d: 2.4

enclosure:
  wall:
    thickness: 2.4
    clearance: 1.0
    fillet_radius: 2.0
  base:
    thickness: 1.6
  lid:
    thickness: 1.6

features:
  pcb_stands:
    - x: 5
      y: 5
    - x: 25
      y: 5
    - x: 5
      y: 35
    - x: 25
      y: 35
  push_buttons:
    - name: select
      x: 15
      y: 14
      shape: rectangle
      cap:
        length: 8
        width: 6
        radius: 0
      lid:
        protrusion: 3
      switch:
        height: 5.5
        travel: 1.0
        pole_diameter: 3.5

    - name: reset
      x: 15
      y: 28
      shape: circle
      cap:
        length: 8
        width: 8
        radius: 4
      lid:
        protrusion: 0
        slack: 0.25
        snap_slack: 0.2
      switch:
        height: 3.0
        travel: 1.0
        pole_diameter: 3.5

tolerances:
  holes: 0.4
  perimeter: 1.0
