---
# Example: Partial final dimensions configuration
# This demonstrates specifying only one dimension (length),
# with width using default clearance.

project: Partial Final Dimensions Example
version: 1
units: mm
yapp_version: v3.3.8

pcb:
  length: 90.0
  width: 70.0
  thickness: 1.6
  z_clearance: 2.0

enclosure:
  wall:
    thickness: 2.4
  # Only length specified; width uses default clearance
  dimensions:
    length: 100.0  # Target final length only
  
  base:
    thickness: 1.8
  
  lid:
    thickness: 1.6
  
  ridge:
    height: 5.0
    slack: 0.2
    gap: 0.5

# Computed padding:
# Length: (100.0 - 90.0 - 2.4×2) / 2 = 2.6 mm (front and back)
# Width: Uses default clearance 1.0 mm (left and right)
# Resulting shell dimensions: 100.0 × (70 + 1.0 + 1.0 + 2.4×2) = 100.0 × 76.8 mm

