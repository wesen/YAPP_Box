      shape: rounded_rect
      from_face_left: 25
      from_face_bottom: 10
      width: 8
      length: 4
      radius: 1
  light_tubes:
    - x: 15
      y: 8
      tube_length: 2.5
      tube_width: 4
      tube_wall: 1
      gap_above_pcb: 0.5
      shape: circle

coordinates:
  origin: boxinside
  reference_plane: base

tolerances:
  perimeter: 0.5
  holes: 0.3
  mating: 0.2


