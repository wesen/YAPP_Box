project: YAPP Compare - Cutouts All Faces
yapp_version: v3

pcb:
  length: 60
  width: 50
  thickness: 1.6
  z_clearance: 7.0

enclosure:
  wall:
    thickness: 2.0
    clearance: 1
    fillet_radius: 2.0
  base:
    thickness: 1.0
    wall_height: 10
  lid:
    thickness: 1.0
    wall_height: 12
  ridge:
    height: 4.0
    slack: 0.2

features:
  cutouts:
    # Base: rounded rectangle (center-ish)
    - face: base
      from_face_back: 25    # depth from back edge
      from_face_left: 20    # horizontal from left edge
      width: 20
      length: 16
      radius: 3
      shape: rounded_rect
      angle: 15

    # Lid: circle
    - face: lid
      from_face_back: 30    # depth from back edge
      from_face_left: 25    # horizontal from left edge
      width: 0
      length: 0
      radius: 6
      shape: circle

    # Front: rectangle (center-ish)
    - face: front
      from_face_left: 15    # horizontal position
      from_face_bottom: 11  # vertical from bottom (center-ish, shellHeight ~ 22)
      width: 24
      length: 8
      radius: 0
      shape: rectangle

    # Back: rounded rectangle, rotated
    - face: back
      from_face_left: 20    # horizontal position
      from_face_bottom: 14  # vertical from bottom (higher than center)
      width: 24
      length: 10
      radius: 2
      shape: rounded_rect
      angle: 10

    # Left: rectangle (near top)
    - face: left
      from_face_left: 18    # horizontal position
      from_face_bottom: 18  # vertical from bottom (near top, shellHeight ~ 22)
      width: 18
      length: 8
      radius: 0
      shape: rectangle

    # Right: rounded rectangle (near center)
    - face: right
      from_face_left: 22    # horizontal position
      from_face_bottom: 11  # vertical from bottom (near center)
      width: 18
      length: 10
      radius: 2
      shape: rounded_rect


