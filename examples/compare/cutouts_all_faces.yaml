project: YAPP Compare - Cutouts All Faces
yapp_version: v3

pcb:
  length: 60
  width: 50
  thickness: 1.6
  z_clearance: 7.0

enclosure:
  wall:
    thickness: 2.0
    clearance: 1
    fillet_radius: 2.0
  base:
    thickness: 1.0
    wall_height: 10
  lid:
    thickness: 1.0
    wall_height: 12
  ridge:
    height: 4.0
    slack: 0.2

features:
  cutouts:
    # Base: rounded rectangle (center-ish)
    - face: base
      from_back: 25
      from_left: 20
      width: 20
      length: 16
      radius: 3
      shape: rounded_rect
      angle: 15

    # Lid: circle
    - face: lid
      from_back: 30
      from_left: 25
      width: 0
      length: 0
      radius: 6
      shape: circle

    # Front: rectangle (posy≈15, posz≈6)
    - face: front
      from_back: 15
      from_left: 0    # overridden by pos_z on side faces
      pos_z: 11       # center-ish (shellHeight ~ 22)
      width: 24
      length: 8
      radius: 0
      shape: rectangle

    # Back: rounded rectangle, rotated
    - face: back
      from_back: 20
      from_left: 0    # overridden by pos_z on side faces
      pos_z: 14       # higher than center
      width: 24
      length: 10
      radius: 2
      shape: rounded_rect
      angle: 10

    # Left: rectangle (near top)
    - face: left
      from_back: 18
      from_left: 0    # overridden by pos_z on side faces
      pos_z: 18       # near top (shellHeight ~ 22)
      width: 18
      length: 8
      radius: 0
      shape: rectangle

    # Right: rounded rectangle (near center)
    - face: right
      from_back: 22
      from_left: 0    # overridden by pos_z on side faces
      pos_z: 11       # near center
      width: 18
      length: 10
      radius: 2
      shape: rounded_rect


